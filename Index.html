<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Surprise 💖</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Arial', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  transition: background 0.6s;
}

.dark {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
}

/* CENTER */
.center {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* PAGE 1 */
#page1 h1 {
  font-size: 70px;
  color: white;
}

#page1 p {
  font-size: 26px;
  color: white;
  margin: 20px 0;
}

#page1 button {
  padding: 15px 40px;
  font-size: 20px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: white;
  color: #ff4d6d;
}

/* PAGE 2 */
#page2 {
  display: none;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

h2 {
  color: #ff4d6d;
  margin-bottom: 25px;
}

button {
  padding: 12px 25px;
  border-radius: 12px;
  border: none;
  font-size: 18px;
  margin: 10px;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #adb5bd;
  color: white;
  position: absolute;
}

#message {
  margin-top: 20px;
  font-size: 22px;
  display: none;
  color: #ff4d6d;
}

/* HEARTS */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 24px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* CONFETTI */
.confetti {
  position: fixed;
  top: 0;
  font-size: 20px;
  animation: fall 3s linear infinite;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

/* SHAKE */
.shake {
  animation: shake 0.4s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  50% { transform: translateX(10px); }
  75% { transform: translateX(-10px); }
  100% { transform: translateX(0); }
}

/* TOGGLE */
#toggle {
  position: fixed;
  top: 15px;
  right: 15px;
  background: white;
  padding: 8px 15px;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="toggle" onclick="toggleTheme()">🌙 Theme</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2023/02/14/audio_7b9f4f6a8d.mp3">
</audio>

<!-- PAGE 1 -->
<div id="page1" class="center">
  <div>
    <h1>14 FEB 💘</h1>
    <p>Hey you… someone special is here 💖</p>
    <button onclick="start()">Tap for surprise 💕</button>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="center">
  <div class="box">
    <h2>Will you be my Valentine? 😘</h2>
    <button id="yes">YES 😍</button>
    <button id="no">NO 😒</button>
    <p id="message">
      Yayyyy!! 💖 I knew it 😍<br><br>
      <button onclick="surprise()">One more surprise 🎁</button>
    </p>
  </div>
</div>

<script>
const music = document.getElementById("music");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("message");
let noCount = 0;
const texts = ["NO 😒","Are you sure? 😳","Really?? 🥺","Last chance 😭"];

function start() {
  document.getElementById("page1").style.display = "none";
  document.getElementById("page2").style.display = "flex";
  music.play();
}

/* NO BUTTON */
noBtn.addEventListener("mouseover", () => {
  noCount++;
  noBtn.innerText = texts[Math.min(noCount, texts.length-1)];
  noBtn.style.transform = `scale(${1 - noCount*0.1})`;

  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

/* YES */
yesBtn.addEventListener("click", () => {
  msg.style.display = "block";
  document.body.classList.add("shake");
  confetti();
});

/* HEARTS */
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},300);

/* CONFETTI */
function confetti() {
  for(let i=0;i<50;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.innerHTML="🎉";
    c.style.left=Math.random()*100+"vw";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

/* SURPRISE */
function surprise() {
  alert("This moment is officially ours 💕");
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* EASTER EGG */
let clicks=0;
document.body.addEventListener("click",()=>{
  clicks++;
  if(clicks===5) alert("Secret unlocked 💌 You’re adorable 😘");
});

document.addEventListener("keydown",(e)=>{
  if(e.key==="y") confetti();
});
</script>

</body>
</html>
